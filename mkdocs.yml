site_name: real_option_models_rl
site_description: Application of Reainforcement Learning in solving optimal stopping problems for real options.

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.tabs

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false


markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home Page: index.md
  - Theoretical Introduction: Theory.md
  - Algorithms and Simulations:
    - Algorithm 1: notebooks/01_algorithm_1_pi_pi_os.ipynb
    - Algorithm 4: notebooks/02_algorithm_4_spi_pi_os.ipynb